server:
    port: 8081

spring:
    application:
        name: auth-service

    datasource:
        url: jdbc:mysql://localhost:3306/auth_db
        username: root
        password: root

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoints:
        web:
            exposure:
                include: "*"

jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expiration: 3600000
