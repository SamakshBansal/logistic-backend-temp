spring:
    application:
        name: order-service
    datasource:
        url: jdbc:mysql://localhost:3306/order_db
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest

server:
    port: 8082

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true

jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
